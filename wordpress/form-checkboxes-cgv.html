<!--
  Cases à cocher CGV — à intégrer dans le formulaire d'inscription
  Compatible Contact Form 7, WPForms, Gravity Forms, ou formulaire HTML brut.
  À placer juste avant le bouton de soumission.
-->

<fieldset class="evd-cgv-fieldset">
  <legend><strong>Conditions à accepter pour valider l'inscription</strong></legend>

  <!-- Case 1 : Nature pédagogique -->
  <label class="evd-cgv-item">
    <input type="checkbox" name="cgv_pedagogique" value="1" required>
    <span>
      J'ai pris connaissance que le stage est un <strong>parcours pédagogique
      d'apprentissage de la lutherie</strong>, et non une prestation commerciale
      de fabrication ou de livraison d'instrument.
    </span>
  </label>

  <!-- Case 2 : Non-garantie de finalisation -->
  <label class="evd-cgv-item">
    <input type="checkbox" name="cgv_non_garantie" value="1" required>
    <span>
      J'ai pris connaissance qu'<strong>un seul stage de 10 jours ne garantit pas
      nécessairement la finalisation de l'accordéon</strong>. La progression dépend
      de chaque stagiaire, du modèle choisi et des étapes réalisées.
    </span>
  </label>

  <!-- Case 3 : Session de retour -->
  <label class="evd-cgv-item">
    <input type="checkbox" name="cgv_retour" value="1" required>
    <span>
      J'ai pris connaissance qu'il est possible de <strong>revenir lors d'une session
      ultérieure</strong> pour terminer l'instrument, moyennant le <strong>forfait
      pédagogique quotidien de 80 € / jour</strong> (atelier, outillage, guidance),
      à convenir avec le formateur.
    </span>
  </label>

  <!-- Case 4 : Acompte -->
  <label class="evd-cgv-item">
    <input type="checkbox" name="cgv_acompte" value="1" required>
    <span>
      J'ai pris connaissance que l'<strong>acompte de 40 % est non remboursable</strong>
      (il couvre les frais de préparation des pièces engagés avant le stage).
      La place peut toutefois être reportée ou cédée à un tiers.
    </span>
  </label>

  <!-- Case 5 : CGV complètes -->
  <label class="evd-cgv-item">
    <input type="checkbox" name="cgv_accepte" value="1" required>
    <span>
      J'ai lu et j'accepte les
      <a href="/cgv/" target="_blank"><strong>Conditions Générales de Vente</strong></a>
      dans leur intégralité.
    </span>
  </label>

</fieldset>

<style>
.evd-cgv-fieldset {
  border: 2px solid #c8a96e;
  border-radius: 6px;
  padding: 20px 24px;
  margin: 24px 0;
  background: #fffbf2;
}
.evd-cgv-fieldset legend {
  padding: 0 8px;
  color: #5a3e1b;
  font-size: 1em;
}
.evd-cgv-item {
  display: flex;
  align-items: flex-start;
  gap: 12px;
  margin: 14px 0;
  cursor: pointer;
  line-height: 1.5;
  font-size: 0.95em;
}
.evd-cgv-item input[type="checkbox"] {
  margin-top: 3px;
  flex-shrink: 0;
  width: 18px;
  height: 18px;
  cursor: pointer;
  accent-color: #c8a96e;
}
.evd-cgv-item span {
  color: #333;
}
.evd-cgv-item a {
  color: #5a3e1b;
  text-decoration: underline;
}
</style>
